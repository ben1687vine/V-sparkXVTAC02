:root{--ink:#171b24;--muted:#667085;--paper:#f7f4ed;--cream:#fffdf8;--rust:#b55434;--rust-dark:#7c2f24;--ochre:#d7a53b;--line:#dfd8ca;--shadow:0 18px 48px #241d1620}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#d9d2c5}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#fff8e6 0 18%,transparent 40%),linear-gradient(135deg,#e6e0d6,#c9c0b2);color:var(--ink);font-family:'Noto Sans TC',sans-serif}button,input,select{font:inherit}.shell{width:min(100%,520px);min-height:100vh;margin:auto;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}.masthead{padding:22px 24px 17px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.12em;font-size:14px}.edition{color:#e9c36a;font-size:11px;letter-spacing:.12em}.view{display:none;padding:28px 22px 36px;animation:rise .35s ease both}.view.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{color:var(--rust);font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.hero{padding:25px 0 22px;border-bottom:1px solid var(--line)}h1,h2,h3{font-family:'Noto Serif TC',serif;margin:0}h1{font-size:clamp(35px,10vw,54px);line-height:1.12;letter-spacing:.03em;margin:10px 0 14px}h1 em{font-style:normal;color:var(--rust)}h2{font-size:24px}.lead{font-size:15px;line-height:1.9;color:#4c5563;margin:0}.panel{background:var(--cream);border:1px solid var(--line);padding:22px;margin-top:20px;box-shadow:0 8px 24px #33281a0b}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel-title span{font-size:12px;color:var(--muted)}label{display:block;color:#454c58;font-size:13px;font-weight:700;margin:0 0 7px}.field{margin-bottom:16px}input,select{width:100%;border:1px solid #cfc7b8;background:#fff;padding:13px 14px;border-radius:2px;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--rust);box-shadow:0 0 0 3px #b5543419}.primary,.secondary{width:100%;border:0;border-radius:2px;padding:15px 18px;font-weight:900;letter-spacing:.08em;cursor:pointer}.primary{background:var(--rust);color:#fff;box-shadow:0 8px 18px #7c2f2430}.primary:active{transform:translateY(1px)}.secondary{background:transparent;border:1px solid #a99e8d;color:#6b6257;margin-top:10px}.progress{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--muted);font-size:12px;font-weight:700}.progress-line{height:4px;background:#e4ded2;flex:1}.progress-line i{display:block;height:100%;width:50%;background:var(--ochre)}.question{padding:18px 16px;margin:0 0 12px;background:var(--cream);border:1px solid var(--line)}.question p{font-family:'Noto Serif TC',serif;font-weight:800;line-height:1.65;margin:0 0 14px;font-size:15px}.scores{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.score{aspect-ratio:1;border:1px solid #d4c9b8;background:#fff;color:#777;cursor:pointer;border-radius:50%;font-size:12px;padding:0}.score.active{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.12)}.hint{display:flex;justify-content:space-between;color:#9b9488;font-size:10px;margin-top:8px}.result-card{position:relative;overflow:hidden;padding:24px 20px 18px;background:var(--ink);color:#fff;border:5px solid var(--ochre);outline:1px solid #f3dc8d;outline-offset:-10px}.result-card:before{content:'VTAC';position:absolute;right:-15px;top:30px;color:#fff1;font:900 100px/1 'Noto Serif TC';transform:rotate(-12deg)}.result-card>*{position:relative}.card-kicker{color:#e7bc58;font-size:11px;letter-spacing:.18em}.role-art{width:150px;height:185px;margin:18px auto 20px;border:1px solid #e7bc58;background:linear-gradient(145deg,#5c251c,#1d2029);display:grid;place-items:center;font-size:76px}.role-name{font-family:'Noto Serif TC';font-size:27px;color:#f5d77e;text-align:center;margin-bottom:15px}.result-copy{border-left:3px solid var(--ochre);padding:10px 13px;background:#fff10d;color:#f5f1e8;font-size:13px;line-height:1.8}.result-copy strong{color:#f5d77e}.card-foot{text-align:center;color:#c8bda9;font-size:10px;margin-top:16px}.notice{position:fixed;inset:0;background:#171b2488;display:none;place-items:center;padding:22px;z-index:5}.notice.show{display:grid}.notice-box{max-width:330px;width:100%;background:var(--cream);padding:25px;text-align:center;box-shadow:var(--shadow)}.notice-box p{line-height:1.7;font-size:14px}.notice-box button{width:auto;padding:11px 28px}
/* Courtly finish: velvet, parchment, and restrained gilded details. */
:root{--ink:#21100f;--muted:#876f61;--paper:#2a0d12;--cream:#f8efdc;--rust:#8e2430;--rust-dark:#4d111b;--ochre:#c99a3e;--line:#b18443;--shadow:0 22px 60px #160304cc}
html{background:#160609}
body{background:radial-gradient(ellipse at 50% -10%,#6d2930 0,#2b0d14 40%,#100407 100%);font-family:'Noto Sans TC',sans-serif;position:relative}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(115deg,transparent 0 48%,#f1d28a 49%,transparent 50%),linear-gradient(65deg,transparent 0 48%,#f1d28a 49%,transparent 50%);background-size:72px 72px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
.shell{background:linear-gradient(180deg,#321016 0,#1c080c 100%);border-left:1px solid #d0a454;border-right:1px solid #d0a454;box-shadow:0 0 0 5px #3f1716,0 0 0 7px #c99a3e,0 25px 80px #000}
.masthead{padding:21px 24px 18px;background:linear-gradient(135deg,#21080d,#531a22 52%,#21080d);border-bottom:1px solid #d3a850;position:relative}
.masthead:before,.masthead:after{content:'◆';color:#e6c36e;font-size:11px;position:absolute;top:23px}.masthead:before{left:9px}.masthead:after{right:9px}.brand{color:#f7e3ae;font-family:'Noto Serif TC',serif;letter-spacing:.16em}.edition{color:#e6c36e}
.view{padding:30px 22px 40px}.eyebrow{color:#e1b95f;letter-spacing:.24em;text-shadow:0 1px 8px #e1b95f66}.hero{padding:27px 5px 25px;border-bottom:1px solid #9e7136;position:relative}.hero:after{content:'✦';display:block;color:#d7aa4e;text-align:center;font-size:18px;position:absolute;bottom:-12px;left:calc(50% - 10px);background:#2a0d12;padding:0 8px}h1{color:#f8e7b1;text-shadow:0 2px 0 #4f171a,0 0 22px #d4a74d55}h1 em{color:#e1b95f}.lead{color:#e5d6be}.panel,.question{background:linear-gradient(145deg,#fff8e7,#ead8b9);border:1px solid #c99a3e;box-shadow:inset 0 0 0 4px #f7e7c533,inset 0 0 20px #a36d2b19,0 10px 28px #09010266;position:relative}.panel:before,.question:before{content:'✦';position:absolute;top:7px;right:10px;color:#b18132;font-size:12px}.panel-title h2{color:#4d1719}.panel-title span{color:#936f3c}.panel label{color:#6d392b}.field input,.field select{background:#fffaf0;border-color:#b99255;color:#3b1715}.field input:focus,.field select:focus{border-color:#8e2430;box-shadow:0 0 0 3px #8e243022}.primary{background:linear-gradient(180deg,#c89b3e,#956524 55%,#71461c);border:1px solid #f6d988;box-shadow:inset 0 1px #fff4bd,0 7px 16px #3c090d66;color:#fff8db;text-shadow:0 1px #4b1a11}.secondary{color:#e9d6aa;border-color:#b99048}.progress{color:#e1bd6c}.progress-line{background:#4e2322;border:1px solid #926b35;height:6px}.progress-line i{background:linear-gradient(90deg,#a86c27,#f0cf75);box-shadow:0 0 8px #e8bf5e88}.question p{color:#4b1d19}.score{background:#fffaf0;border-color:#bd9659;color:#765644}.score.active{background:linear-gradient(145deg,#dcb75a,#8c5a1c);border-color:#fff0a5;box-shadow:0 0 10px #d5a74399;color:#24100e}.hint{color:#9a7954}
.result-card{background:linear-gradient(145deg,#4a161d,#19070b 75%);border-color:#dbaf51;box-shadow:inset 0 0 0 4px #6f391f,inset 0 0 0 6px #d2a349,0 15px 30px #08010299}.result-card:after{content:'✦  VTAC  ✦';position:absolute;top:10px;right:15px;color:#d8ac56;font-size:10px;letter-spacing:.1em}.card-kicker{color:#e2bc68}.role-art{background:radial-gradient(circle at 50% 40%,#7c3332,#260b11 65%);border-color:#d8ab50;box-shadow:inset 0 0 22px #070102,0 0 16px #d2a24955}.role-name{color:#f3cf79;text-shadow:0 2px #210509}.result-copy{background:#fff8e7;color:#5a2c25;border-left-color:#b57c2d}.result-copy strong{color:#8b2930}.card-foot{color:#d1a955}.notice{background:#100205cc}.notice-box{background:linear-gradient(145deg,#fff5df,#e5c995);border:2px solid #c99a3e;box-shadow:0 0 0 5px #3d1517,0 20px 45px #000}.notice-box h3{color:#57171c}.notice-box p{color:#5c352a}
@media (min-width:521px){.shell{margin:16px auto;min-height:calc(100vh - 32px)}}

<body><main class="shell"><header class="masthead"><div class="brand">VTAC 康士藤人才測評中心</div><div class="edition">FUTURE FORESIGHT</div></header>
<section class="view active" id="intro"><div class="hero"><div class="eyebrow">洞見未來 · 60 SEC</div><h1>解鎖你的<br><em>職場角色</em></h1><p class="lead">高壓挑戰來臨時，你會如何應對？完成八題快速測驗，找到屬於你的職場冒險者。</p></div><div class="panel"><div class="panel-title"><h2>建立冒險者檔案</h2><span>01 / 03</span></div><div class="field"><label for="name">角色名稱（ID）</label><input id="name" placeholder="姓名或暱稱" maxlength="30"></div><div class="field"><label for="company">所屬冒險者公會（公司）</label><input id="company" placeholder="公司名稱" maxlength="50"></div><div class="field"><label for="age">當前等級（年齡）</label><input id="age" type="number" min="1" max="120" placeholder="例如：25"></div><div class="field"><label for="gender">性別屬性</label><select id="gender"><option value="">請選擇</option><option>男</option><option>女</option><option>不透露</option></select></div><button class="primary" id="start">開啟挑戰　→</button></div></section>
<section class="view" id="q1"><div class="progress"><span>任務階段 1 / 2</span><div class="progress-line"><i></i></div></div><div id="questions-a"></div><button class="primary" id="next">下一階段　→</button></section>
<section class="view" id="q2"><div class="progress"><span>任務階段 2 / 2</span><div class="progress-line"><i style="width:100%"></i></div></div><div id="questions-b"></div><button class="primary" id="finish">結算專屬角色　✦</button></section>
<section class="view" id="result"><div class="eyebrow">YOUR RESULT · 角色已解鎖</div><div class="result-card" id="capture"><div class="card-kicker">FUTURE FORESIGHT 洞見未來</div><div class="role-art" id="art">✦</div><div class="role-name" id="role">角色名稱</div><div class="result-copy"><strong>冒險者：<span id="result-name"></span></strong><br><span id="description"></span></div><div class="card-foot">✦ 憑此畫面至活動櫃台，領取您的專屬小禮 ✦</div></div><button class="primary" id="download">下載專屬卡牌</button><button class="secondary" id="restart">重新測驗</button></section></main><div class="notice" id="notice"><div class="notice-box"><h3>提示</h3><p id="notice-text"></p><button class="primary" id="close">知道了</button></div></div>
<script>
const GOOGLE_SCRIPT_URL='YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
const questions=['面對高壓挑戰時，我會專注完成任務，提升安全感。','面對高壓挑戰時，我會守住並努力完成夥伴交付的任務。','面對高壓挑戰時，我會避開任務可能失敗的風險。','面對高壓挑戰時，我會確認任務穩定的推進。','面對高壓挑戰時，我會把握每一個完成任務的機會。','我願意承擔風險，挑戰高難度關卡，爭取任務勝利。','我會選擇能提升等級、累積經驗值的任務關卡。','我會花時間找攻略，規劃角色養成，順利闖關。'];
const means=[8.57,8.73,8.64,8.44,8.40,7.62,7.68,7.36],sds=[1.37,1.28,1.47,1.40,1.45,1.75,1.98,1.98],scores=Array(8).fill(0);
const roles={法師:{title:'第一象限：策略的法師',icon:'◈',desc:'不問得失，專注於知識累積，享受完成的成就感。你擅長從攻略找出最優解，用智慧與策略在壓力關卡中游刃有餘。'},騎士:{title:'第二象限：守護的騎士',icon:'♜',desc:'以守護與避免失敗為優先，謹慎評估、穩健前行。你是團隊最堅實的後盾，能確保任務穩定推進。'},弓箭手:{title:'第三象限：專注的弓箭手',icon:'➶',desc:'視挑戰為千載難逢的機會，果斷行動、精準打擊。你是積極的機會開拓者，勇於承擔風險換取成就。'},探險家:{title:'第四象限：勇敢的探險家',icon:'✧',desc:'兼顧機會與風險，既充滿好奇心追求成功，也懂得備妥裝備避免失敗。你具備卓越的平衡感。'}};
function renderQuestions(target,start){const box=document.getElementById(target);box.innerHTML=questions.slice(start,start+4).map((text,offset)=>{const i=start+offset;return `<article class="question"><p>${i+1}. ${text}</p><div class="scores">${Array.from({length:10},(_,n)=>`<button class="score" data-q="${i}" data-value="${n+1}">${n+1}</button>`).join('')}</div><div class="hint"><span>極不符合</span><span>極為符合</span></div></article>`}).join('')}
renderQuestions('questions-a',0);renderQuestions('questions-b',4);document.addEventListener('click',e=>{const btn=e.target.closest('.score');if(!btn)return;const q=+btn.dataset.q;scores[q]=+btn.dataset.value;document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.classList.toggle('active',el===btn))});
const show=(id)=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)};const alertUser=(msg)=>{document.getElementById('notice-text').textContent=msg;document.getElementById('notice').classList.add('show')};
document.getElementById('close').onclick=()=>document.getElementById('notice').classList.remove('show');document.getElementById('start').onclick=()=>show('q1');document.getElementById('next').onclick=()=>scores.slice(0,4).some(v=>!v)?alertUser('請先完成第一階段的四題評分。'):show('q2');
function normal(z){const sign=z<0?-1:1;z=Math.abs(z);const k=1/(1+.2316419*z),p=1-Math.exp(-z*z/2)/Math.sqrt(2*Math.PI)*k*(.31938153+k*(-.356563782+k*(1.781477937+k*(-1.821255978+1.330274429*k))));return .5+sign*(p-.5)}
document.getElementById('finish').onclick=()=>{if(scores.slice(4).some(v=>!v))return alertUser('請先完成第二階段的四題評分。');let prev=0,prom=0;scores.forEach((v,i)=>(i<4?prev+=normal((v-means[i])/sds[i]):prom+=normal((v-means[i])/sds[i])));prev/=4;prom/=4;const key=prom>=.5?(prev>=.5?'探險家':'弓箭手'):(prev>=.5?'騎士':'法師'),res=roles[key];document.getElementById('role').textContent=res.title;document.getElementById('art').textContent=res.icon;document.getElementById('description').textContent=res.desc;document.getElementById('result-name').textContent=document.getElementById('name').value.trim()||'無名冒險者';show('result');if(GOOGLE_SCRIPT_URL.startsWith('http'))fetch(GOOGLE_SCRIPT_URL,{method:'POST',body:new URLSearchParams({name:document.getElementById('name').value,company:document.getElementById('company').value,age:document.getElementById('age').value,gender:document.getElementById('gender').value,scores:scores.join(','),role:res.title})}).catch(()=>{})};
document.getElementById('download').onclick=()=>{if(!window.html2canvas)return alertUser('下載功能需要網路載入元件，請直接截圖保存結果卡。');html2canvas(document.getElementById('capture'),{scale:2,backgroundColor:'#171b24'}).then(canvas=>{const a=document.createElement('a');a.download='Future_Foresight_我的角色卡.png';a.href=canvas.toDataURL();a.click()}).catch(()=>alertUser('下載失敗，請直接截圖保存結果卡。'))};document.getElementById('restart').onclick=()=>location.reload();
</script><script>
const roleImageNames={'◈':'PSCS01','♜':'PSCS02','➶':'PSCS03','✧':'PSCS04'};
const roleImageExtensions=['jpg','jpeg','png'];
function loadRoleImage(){
	const art=document.getElementById('art');
	const baseName=roleImageNames[art.textContent];
	if(!baseName)return;
	let extensionIndex=0;
	const tryNext=()=>{
		if(extensionIndex>=roleImageExtensions.length)return;
		const image=new Image();
		const extension=roleImageExtensions[extensionIndex++];
		image.onload=()=>{art.textContent='';art.style.backgroundImage=`url('${baseName}.${extension}')`;art.style.backgroundSize='cover';art.style.backgroundPosition='center';art.style.color='transparent'};
		image.onerror=tryNext;
		image.src=`${baseName}.${extension}`;
	};
	tryNext();
}
document.getElementById('finish').addEventListener('click',()=>requestAnimationFrame(loadRoleImage));
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></body></html>
