m;cursor:pointer}.primary{background:var(--rust);color:#fff;box-shadow:0 8px 18px #7c2f2430}.primary:active{transform:translateY(1px)}.secondary{background:transparent;border:1px solid #a99e8d;color:#6b6257;margin-top:10px}.progress{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--muted);font-size:12px;font-weight:700}.progress-line{height:4px;background:#e4ded2;flex:1}.progress-line i{display:block;height:100%;width:50%;background:var(--ochre)}.question{padding:18px 16px;margin:0 0 12px;background:var(--cream);border:1px solid var(--line)}.question p{font-family:'Noto Serif TC',serif;font-weight:800;line-height:1.65;margin:0 0 14px;font-size:15px}.scores{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.score{aspect-ratio:1;border:1px solid #d4c9b8;background:#fff;color:#777;cursor:pointer;border-radius:50%;font-size:12px;padding:0}.score.active{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.12)}.hint{display:flex;justify-content:space-between;color:#9b9488;font-size:10px;margin-top:8px}.result-card{position:relative;overflow:hidden;padding:24px 20px 18px;background:var(--ink);color:#fff;border:5px solid var(--ochre);outline:1px solid #f3dc8d;outline-offset:-10px}.result-card:before{content:'VTAC';position:absolute;right:-15px;top:30px;color:#fff1;font:900 100px/1 'Noto Serif TC';transform:rotate(-12deg)}.result-card>*{position:relative}.card-kicker{color:#e7bc58;font-size:11px;letter-spacing:.18em}.role-art{width:150px;height:185px;margin:18px auto 20px;border:1px solid #e7bc58;background:linear-gradient(145deg,#5c251c,#1d2029);display:grid;place-items:center;font-size:76px}.role-name{font-family:'Noto Serif TC';font-size:27px;color:#f5d77e;text-align:center;margin-bottom:15px}.result-copy{border-left:3px solid var(--ochre);padding:10px 13px;background:#fff10d;color:#f5f1e8;font-size:13px;line-height:1.8}.result-copy strong{color:#f5d77e}.card-foot{text-align:center;color:#c8bda9;font-size:10px;margin-top <body><main class="shell"><header class="masthead"><div class="brand">VTAC 康士藤人才測評中心</div><div class="edition">FUTURE FORESIGHT</div></header>
<section class="view active" id="intro"><div class="hero"><div class="eyebrow">洞見未來 · 60 SEC</div><h1>解鎖你的<br><em>職場角色</em></h1><p class="lead">挑戰來臨時，你會如何應對？完成八題快速測驗，找到屬於你的職場角色。</p></div><div class="panel"><div class="panel-title"><h2>建立冒險者檔案</h2><span>01 / 03</span></div><div class="field"><label for="name">冒險者名稱（ID）</label><input id="name" placeholder="姓名或暱稱" maxlength="30"></div><div class="field"><label for="company">所屬冒險者公會（公司）</label><input id="company" placeholder="公司名稱" maxlength="50"></div><div class="field"><label for="age">當前等級（年齡）</label><input id="age" type="number" min="1" max="120" placeholder="例如：25"></div><div class="field"><label for="gender">性別屬性</label><select id="gender"><option value="">請選擇</option><option>男</option><option>女</option><option>不透露</option></select></div><button class="primary" id="start">開啟挑戰　→</button></div></section>
<section class="view" id="q1"><div class="progress"><span>任務階段 1 / 2</span><div class="progress-line"><i></i></div></div><div id="questions-a"></div><button class="primary" id="next">下一階段　→</button></section>
<section class="view" id="q2"><div class="progress"><span>任務階段 2 / 2</span><div class="progress-line"><i style="width:100%"></i></div></div><div id="questions-b"></div><button class="primary" id="finish">結算專屬角色　✦</button></section>
<section class="view" id="result"><div class="eyebrow">YOUR RESULT · 角色已解鎖</div><div class="result-card" id="capture"><div class="card-kicker">FUTURE FORESIGHT 洞見未來</div><div class="role-art" id="art">✦</div><div class="role-name" id="role">角色名稱</div><div class="result-copy"><strong>冒險者：<span id="result-name"></span></strong><br><span id="description"></span><div class="axis-scores"><span>風險 Y 軸：<strong id="risk-score">0</strong> 分</span><span>機會 X 軸：<strong id="opportunity-score">0</strong> 分</span></div></div><div class="card-foot">✦ 憑此畫面至活動櫃台，領取您的專屬小禮 ✦</div></div><button class="primary" id="download">下載專屬卡牌</button><button class="secondary" id="restart">重新測驗</button></section></main><div class="notice" id="notice"><div class="notice-box"><h3>提示</h3><p id="notice-text"></p><button class="primary" id="close">知道了</button></div></div>
<script>
const GOOGLE_SCRIPT_URL='YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
const questions=['面對挑戰時，我會專注完成任務，提升安全感。','面對挑戰時，我會守住並努力完成夥伴交付的任務。','面對挑戰時，我會避開任務可能失敗的風險。','面對挑戰時，我會確認任務穩定的推進。','面對挑戰時，我會把握每一個完成任務的機會。','我願意承擔風險，挑戰高難度關卡，爭取任務勝利。','我會優先選擇能提升等級、累積經驗值的任務關卡。','我會花時間找攻略，規劃角色養成，以順利闖關。'];
const scores=Array(8).fill(0);
const roles={法師:{title:'第一象限：策略的法師',icon:'◈',desc:'風險與機會意識都高，你能在高壓與高期待中累積知識、找出最優解，運用智慧與策略完成任務。'},騎士:{title:'第二象限：守護的騎士',icon:'♜',desc:'風險意識高、機會意識低，你以守護與避免失敗為優先，是團隊最堅實的後盾，能確保任務穩定推進。'},弓箭手:{title:'第三象限：專注的弓箭手',icon:'➶',desc:'風險與機會意識都低，你傾向專注自身與團隊的累積，先從攻略找出解答，再運用策略精準完成任務。'},探險家:{title:'第四象限：勇敢的探險家',icon:'✧',desc:'風險意識低、機會意識高，你把挑戰視為機會，能無畏困難果斷行動，積極開拓並爭取任務成果。'}};
function renderQuestions(target,start){const box=document.getElementById(target);box.innerHTML=questions.slice(start,start+4).map((text,offset)=>{const i=start+offset;return `<article class="question"><p>${i+1}. ${text}</p><div class="scores">${Array.from({length:10},(_,n)=>`<button class="score" data-q="${i}" data-value="${n+1}">${n+1}</button>`).join('')}</div><div class="hint"><span>極不符合</span><span>極為符合</span></div></article>`}).join('')}
renderQuestions('questions-a',0);renderQuestions('questions-b',4);document.addEventListener('click',e=>{const btn=e.target.closest('.score');if(!btn)return;const q=+btn.dataset.q;scores[q]=+btn.dataset.value;document.querySelectorAll(`[data-q="${q}"]`).forEach(el=>el.classList.toggle('active',el===btn))});
const show=(id)=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)};const alertUser=(msg)=>{document.getElementById('notice-text').textContent=msg;document.getElementById('notice').classList.add('show')};
document.getElementById('close').onclick=()=>document.getElementById('notice').classList.remove('show');document.getElementById('start').onclick=()=>show('q1');document.getElementById('next').onclick=()=>scores.slice(0,4).some(v=>!v)?alertUser('請先完成第一階段的四題評分。'):show('q2');
const toPercent=score=>score*10;
document.getElementById('finish').onclick=()=>{if(scores.slice(4).some(v=>!v))return alertUser('請先完成第二階段的四題評分。');const riskScore=Math.round(scores.slice(0,4).reduce((sum,score)=>sum+toPercent(score),0)/4);const opportunityScore=Math.round(scores.slice(4).reduce((sum,score)=>sum+toPercent(score),0)/4);const key=opportunityScore>=50?(riskScore>=50?'法師':'探險家'):(riskScore>=50?'騎士':'弓箭手'),res=roles[key];document.getElementById('role').textContent=res.title;document.getElementById('art').textContent=res.icon;document.getElementById('description').textContent=res.desc;document.getElementById('risk-score').textContent=riskScore;document.getElementById('opportunity-score').textContent=opportunityScore;document.getElementById('result-name').textContent=document.getElementById('name').value.trim()||'無名冒險者';show('result');if(GOOGLE_SCRIPT_URL.startsWith('http'))fetch(GOOGLE_SCRIPT_URL,{method:'POST',body:new URLSearchParams({name:document.getElementById('name').value,company:document.getElementById('company').value,age:document.getElementById('age').value,gender:document.getElementById('gender').value,scores:scores.join(','),riskScore,opportunityScore,role:res.title})}).catch(()=>{})};
document.getElementById('download').onclick=async()=>{if(!window.html2canvas)return alertUser('下載功能需要網路載入元件，請直接截圖保存結果卡。');const image=document.querySelector('#art img');try{if(image&&image.decode)await image.decode();else if(image&&!image.complete)await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject});const canvas=await html2canvas(document.getElementById('capture'),{scale:2,backgroundColor:'#171b24',useCORS:true,imageTimeout:15000});const a=document.createElement('a');a.download='Future_Foresight_我的角色卡.png';a.href=canvas.toDataURL('image/png');a.click()}catch(error){console.error('卡牌圖片載入失敗:',error);alertUser('圖片尚未完成載入，請稍候再下載；若仍失敗，請直接截圖保存結果卡。')}};document.getElementById('restart').onclick=()=>location.reload();
</script><script>
const roleImageNames={'◈':'PSCS01','♜':'PSCS02','➶':'PSCS03','✧':'PSCS04'};
const roleImageExtensions=['jpg','jpeg','png'];
function loadRoleImage(){
	const art=document.getElementById('art');
	const baseName=roleImageNames[art.textContent];
	if(!baseName)return;
	let extensionIndex=0;
	const tryNext=()=>{
		if(extensionIndex>=roleImageExtensions.length)return;
		const image=document.createElement('img');
		const extension=roleImageExtensions[extensionIndex++];
		image.alt='職場角色插圖';
		image.title='按住角色圖片即可另存';
		image.onload=()=>{art.textContent='';art.appendChild(image)};
		image.onerror=tryNext;
		image.src=`${baseName}.${extension}`;
	};
	tryNext();
}
async function downloadRoleCard(){
	if(!window.html2canvas)return alertUser('下載功能需要網路載入元件，請直接截圖保存結果卡。');
	try{
		const image=document.querySelector('#art img');
		if(image&&image.decode)await image.decode();
		const canvas=await html2canvas(document.getElementById('capture'),{scale:2,backgroundColor:'#19070b',useCORS:true,imageTimeout:15000});
		const link=document.createElement('a');
		link.download='Future_Foresight_專屬角色卡.png';
		link.href=canvas.toDataURL('image/png');
		link.click();
	}catch(error){
		console.error('專屬角色卡下載失敗:',error);
		alertUser('角色卡尚未完成載入，請稍候再試。');
	}
}
let holdTimer;
document.addEventListener('pointerdown',event=>{
	const card=event.target.closest('#capture');
	if(!card)return;
	holdTimer=setTimeout(downloadRoleCard,650);
